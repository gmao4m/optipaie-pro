name: Release

# ============================================================================
# Automatic release + auto-update — triggered ONLY by a product VERSION change.
#
# To diffuse a new version (see docs/RELEASE-HOWTO.md):
#   1. bump <Version> in Directory.Build.props,
#   2. write docs/CHANGELOG-<version>-ar.md (Arabic, client-facing),
#   3. git push.
#
# The workflow then, and ONLY when <Version> actually changed in the push:
#   - REQUIRES docs/CHANGELOG-<version>-ar.md (else it FAILS, publishes nothing);
#   - runs the tests (blocking);
#   - builds the installer via build-installer.ps1 (completeness guards blocking);
#   - creates the GitHub Release (body = the Arabic changelog — NEVER a commit list);
#   - verifies the asset is publicly downloadable;
#   - ONLY THEN flips version.json → clients are never pointed at a dead link.
#
# A push that does NOT change <Version> releases nothing. version.json is pushed
# back with the built-in token + [skip ci] and is path-ignored, so it never loops.
# ============================================================================

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.json'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a release even if the tag already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for tags + version diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Read product version (single source: Directory.Build.props)"
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content "Directory.Build.props"
          $v = ([string]$p.Project.PropertyGroup.Version).Trim()
          if (-not $v) { throw "No <Version> found in Directory.Build.props" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Product version = $v"

      - name: "Gate — release ONLY when <Version> changed in this push"
        id: gate
        shell: pwsh
        run: |
          $v     = "${{ steps.ver.outputs.version }}"
          $force = "${{ github.event.inputs.force }}" -eq "true"

          # Version at the commit BEFORE this push (empty on branch create / dispatch).
          $before = "${{ github.event.before }}"
          $prev = ""
          if ($before -and ($before -notmatch '^0+$')) {
            try {
              $x = [xml](git show "${before}:Directory.Build.props" 2>$null)
              $prev = ([string]$x.Project.PropertyGroup.Version).Trim()
            } catch { $prev = "" }
          }

          $changed   = ($v -ne $prev)
          $tagExists = [bool](git tag -l "${{ steps.ver.outputs.tag }}")
          $go = $force -or ($changed -and -not $tagExists)

          "go=$($go.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v  previous=$prev  changed=$changed  tagExists=$tagExists  force=$force  => release=$go"
          if (-not $go) { Write-Host "::notice::No version change (still $v) — nothing to release." }

      - name: "Require the Arabic changelog for this version (else FAIL — never a commit list)"
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          $f = "docs/CHANGELOG-${{ steps.ver.outputs.version }}-ar.md"
          if (-not (Test-Path $f)) {
            Write-Host "::error::Missing $f — refusing to publish ${{ steps.ver.outputs.version }} without its Arabic changelog."
            exit 1
          }
          if (((Get-Content $f -Raw).Trim()).Length -lt 20) {
            Write-Host "::error::$f is essentially empty — refusing to publish."
            exit 1
          }
          Write-Host "Found $f"

      - name: Setup .NET SDK
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "Run tests (BLOCKING — no release if a test fails)"
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          dotnet test tests/OptiPaie.Tests/OptiPaie.Tests.csproj -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Tests failed — refusing to publish."; exit 1 }

      - name: Install WiX v5 CLI + extensions
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          # Extensions MUST be pinned to the CLI version (unpinned pulls WiX v6 = WIX6101).
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix extension add -g WixToolset.Netfx.wixext/5.0.2

      - name: "Build installer (BLOCKING — completeness guards inside build-installer.ps1)"
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build-installer.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Installer build / guard failed — refusing to publish."; exit 1 }

      - name: Stage release asset (URL-friendly name for the updater)
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: Copy-Item "installer/output/OptiPaie PRO Setup.exe" "installer/output/OptiPaie-PRO-Setup.exe" -Force

      - name: "Create GitHub Release + upload installer (body = Arabic changelog)"
        if: steps.gate.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OptiPaie PRO ${{ steps.ver.outputs.version }}
          body_path: docs/CHANGELOG-${{ steps.ver.outputs.version }}-ar.md
          make_latest: true
          files: |
            installer/output/OptiPaie-PRO-Setup.exe
            installer/output/OptiPaie PRO.msi

      - name: "Verify the asset is publicly downloadable (BLOCKING — before touching version.json)"
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/OptiPaie-PRO-Setup.exe"
          $ok = $false
          for ($i = 1; $i -le 8; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Write-Host "asset not reachable yet (attempt $i)..."
            Start-Sleep -Seconds 6
          }
          if (-not $ok) {
            Write-Host "::error::Released asset is NOT publicly downloadable — NOT flipping version.json (no dead-link notification)."
            exit 1
          }
          Write-Host "Asset public download OK (200)."

      - name: "Flip version.json (Arabic notes from the changelog) and push it back"
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $md = Get-Content "docs/CHANGELOG-$v-ar.md" -Raw

          # Strip markdown to clean plain text for the in-app updater dialog (no # * > markers).
          $plain = foreach ($ln in ($md -split "`r?`n")) {
            $t = $ln
            $t = $t -replace '^\s{0,3}#{1,6}\s*', ''   # headings
            $t = $t -replace '\*\*', ''                # bold
            $t = $t -replace '^\s*>\s?', ''            # blockquote
            $t = $t -replace '^\s*[-*]\s+', ''         # bullets
            $t.Trim()
          }
          $notes = (($plain | Where-Object { $_ -ne '' }) -join "`n")

          $manifest = [ordered]@{
            latest_version = $v
            download_url   = "https://github.com/${{ github.repository }}/releases/latest/download/OptiPaie-PRO-Setup.exe"
            release_notes  = $notes
            mandatory      = $false
          }
          ($manifest | ConvertTo-Json -Depth 5) | Set-Content -Path version.json -Encoding utf8

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if (git diff --cached --quiet) {
            Write-Host "version.json already up to date."
          } else {
            git commit -m "chore(release): version.json -> $v [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
